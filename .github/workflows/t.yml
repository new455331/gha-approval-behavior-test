name: approval-behavior-test
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  pull-requests: write
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Bot approves the PR using GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr review "$PR" --approve --repo "$REPO" --body "automated approval" && echo "APPROVE_OK" || echo "APPROVE_FAILED"
      - name: Show reviews
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh api "repos/$REPO/pulls/$PR/reviews" --jq '.[] | "\(.user.login) -> \(.state)"'
      - name: Attempt merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge "$PR" --squash --repo "$REPO" && echo "MERGE_SUCCEEDED" || echo "MERGE_FAILED"
